name: Build Native Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure & Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package .levipack
        run: |
          mkdir -p dist/arm64-v8a/graphics-toggle/config
          cp build/libgraphics_toggle.so dist/arm64-v8a/graphics-toggle/
          cp manifest.json dist/arm64-v8a/graphics-toggle/
          cp config/*.json dist/arm64-v8a/graphics-toggle/config/ 2>/dev/null || true
          cd dist/arm64-v8a
          zip -r graphics-toggle.levipack graphics-toggle

      - uses: actions/upload-artifact@v4
        with:
          name: graphics-toggle-levipack
          path: dist/arm64-v8a/graphics-toggle.levipack
